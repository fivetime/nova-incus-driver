[tox]
minversion = 4.28.0
envlist = py312,pep8
skipsdist = True

[testenv]
usedevelop = True
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1}
setenv =
  LANGUAGE=en_US
  LC_ALL=C.UTF-8
  PYTHONDONTWRITEBYTECODE=1
deps =
  -e{env:INCUS_SDK_PATH:{toxinidir}/../incus-python-sdk-src}
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
  git+https://opendev.org/openstack/nova@stable/2026.1#egg=nova
commands =
  stestr run {posargs}
  stestr slowest

[testenv:pep8]
commands =
  flake8 nova/virt/incus nova/tests/unit/virt/incus nova_incus_tempest_plugin \
    tools/openstack-incus-fence-agent-provider

[testenv:venv]
commands = {posargs}

[testenv:docs]
basepython = python3.12
commands =
  sphinx-build -W --keep-going -b html doc/source doc/build/html

[flake8]
show-source = True
exclude = .venv,.git,.tox,dist,*lib/python*,*egg,build
max-line-length = 79
# The legacy driver will be reduced as each subsystem is modernized.
max-complexity = 40
per-file-ignores =
  nova/virt/incus/driver.py:H306,H405,E125,E128
  nova/virt/incus/storage.py:H306,E128
  nova/virt/incus/vif.py:H405
  nova/tests/unit/virt/incus/test_driver.py:H214,H306
  nova/tests/unit/virt/incus/test_flavor.py:H306
  nova/tests/unit/virt/incus/test_migrate.py:H306,H405
  nova/tests/unit/virt/incus/test_session.py:H306,H404,H405
  nova/tests/unit/virt/incus/test_storage.py:H306
