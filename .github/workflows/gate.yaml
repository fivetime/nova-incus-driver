name: Python gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable/2026.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out nova-incus
        uses: actions/checkout@v6
        with:
          path: openstack-incus
          persist-credentials: false

      - name: Check out Incus Python SDK
        uses: actions/checkout@v6
        with:
          repository: fivetime/incus-python-sdk
          ref: main
          path: incus-python-sdk
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            openstack-incus/requirements.txt
            openstack-incus/test-requirements.txt
            incus-python-sdk/pyproject.toml

      - name: Install tox
        run: python -m pip install 'tox>=4.28.0' build

      - name: Run unit, style and documentation gates
        working-directory: openstack-incus
        env:
          TOX_CONSTRAINTS_FILE: https://releases.openstack.org/constraints/upper/2026.1
        run: tox -e py312,pep8,docs

      - name: Build and verify distribution
        working-directory: openstack-incus
        env:
          PBR_VERSION: '2026.1.0'
        run: |
          python -m build
          .tox/py312/bin/pip install --no-deps --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/openstack-incus/.tox/py312/bin/python" - <<'PY'
          from importlib import metadata
          from nova.virt.incus.cmd import compute

          entry_points = list(metadata.entry_points(
              group='console_scripts', name='nova-incus-compute'))
          assert len(entry_points) == 1
          assert entry_points[0].load() is compute.main
          PY
